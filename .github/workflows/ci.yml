name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow -d leaveflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run migrations
        working-directory: server
        run: npm run migrate

      - name: Run tests
        working-directory: server
        run: npm test

  test-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run unit tests
        working-directory: client
        run: npx vitest run

      - name: Build
        working-directory: client
        run: npm run build
