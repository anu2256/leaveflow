server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA. Unknown paths fall back to index.html so that
    # client-side routing works on deep links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the LeaveFlow API service. The target uses the
    # Docker Compose service name "api" (not localhost), so it works for
    # container-to-container networking. The /api prefix is preserved to
    # match the backend's routes (e.g. /api/health).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
